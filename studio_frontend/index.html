<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0a1224;color:#e7efff}button{border:1px solid #344864;background:#1a2b45;color:#e9f3ff;border-radius:9px;padding:8px 11px;cursor:pointer}button:hover{border-color:#67b9ff}.wrap{padding:18px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.headline{font-size:20px;font-weight:760}.sub{font-size:12px;color:#a2b5d2;margin-top:5px}.section{margin-top:16px;padding:15px;border:1px solid #31445f;border-radius:12px;background:#111d32}.section-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}.h{font-weight:750;font-size:14px}.pool-group{margin-top:9px}.pool-label{font-size:12px;color:#8baed3;margin-bottom:7px}.pool-items{display:flex;flex-wrap:wrap;gap:7px;min-height:43px}.team{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:8px;background:#1c3150;border:1px solid #395377;cursor:grab;user-select:none;min-width:92px}.team .name{font-weight:750}.tag{font-size:10px;color:#9cdeff;background:#264b69;padding:3px 5px;border-radius:4px}.team.selected{border-color:#59d5ff;box-shadow:0 0 0 1px #59d5ff}.team.used{opacity:.42}.board{overflow-x:auto;padding-bottom:10px}.rounds{display:flex;gap:18px;min-width:max-content;align-items:flex-start}.round{min-width:238px;width:238px;border-left:2px solid #2b5678;padding-left:11px}.round.now{border-left-color:#42d5eb}.roundhead{font-weight:750;color:#a5c7f2;font-size:13px;margin-bottom:10px}.grouphead{font-size:11px;color:#71b7cf;letter-spacing:.5px;margin:12px 0 6px}.match{border:1px solid #2d4766;background:#15253d;padding:7px;border-radius:9px;margin:7px 0}.match.disabled{opacity:.36}.slot{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px dashed #44617f;padding:7px 9px;border-radius:6px;min-height:34px;cursor:pointer;font-size:12px}.slot+.slot{margin-top:4px}.slot.full{border-style:solid;background:#1b3353}.slot.hover{border-color:#7de8ff;box-shadow:0 0 0 1px #7de8ff}.slot.bad{border-color:#fb7070}.slot .placeholder{color:#718dab}.vs{color:#657e9c;font-size:9px;text-align:center;margin:-1px}.locked{border-color:#12bca7}.pill{font-size:10px;color:#6cead6}.future{margin:12px 0;color:#7d98b5;font-size:11px}.notice{margin-top:12px;color:#91dacc;font-size:12px;min-height:20px}.danger{color:#ff9999}.legend{font-size:11px;color:#92aecf}.empty-button{font-size:11px;padding:5px 8px}
</style></head><body><div class="wrap"><div class="topline"><div><div class="headline" id="title"></div><div class="sub" id="intro"></div></div><div style="display:flex;gap:7px"><button id="reset"></button><button id="clear"></button><button id="complete"></button></div></div><section class="section"><div class="section-h"><div class="h" id="pooltitle"></div><span class="legend" id="poolhint"></span></div><div id="pool"></div></section><section class="section"><div class="section-h"><div class="h" id="boardtitle"></div><span class="legend" id="state"></span></div><div class="board"><div class="rounds" id="rounds"></div></div><div class="notice" id="notice"></div></section></div>
<script>
let cfg={},slots=[],origin=[],slotGroups=[],chosen=null,initialized=false;
const cn=()=>cfg.language==='中文';const txt=(a,b)=>cn()?a:b;
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');
function key(a,b){return [a,b].sort().join('||')}
function assigned(){return new Set(slots.flat().filter(Boolean))}
function completed(){return slots.filter(p=>p[0]&&p[1]).map(p=>p.slice())}
function valid(){let all=completed();return all.every(p=>!!cfg.allowed[key(...p)]) && new Set(slots.flat().filter(Boolean)).size===slots.flat().filter(Boolean).length}
function emit(){send('streamlit:setComponentValue',{value:{slots:slots.map(p=>p.slice()),locked:completed(),complete:slots.every(p=>p[0]&&p[1]),change_id:Date.now()}})}
function status(m,err=false){let el=document.getElementById('notice');el.textContent=m;el.className='notice'+(err?' danger':'')}
function put(team,i,j){if(!team||i<0)return;let found=slots.findIndex(p=>p.includes(team));let old=slots[i][j];if(found===i && slots[i][j]===team)return;
 const next=slots.map(p=>p.slice());if(found>=0){let k=next[found].indexOf(team);next[found][k]=old||null;}next[i][j]=team;
 if(next.some((p,i)=>p.some(id=>id&&cfg.teams.find(t=>t.id===id)?.group!==slotGroups[i])||(p[0]&&p[1]&&!cfg.allowed[key(...p)]))){status(txt('不合法：违反赛区、历史对阵或战绩池限制','Illegal: region, rematch or record-pool restriction'),true);return}
 slots=next;chosen=null;render();emit();status(txt('已更新，正在分析剩余合法签表','Updated; analyzing remaining legal completions'))}
function render(){let pool=document.getElementById('pool');pool.replaceChildren();let grouped={};for(let t of cfg.teams)(grouped[t.group]??=[]).push(t);let used=assigned();for(let [name,arr] of Object.entries(grouped)){let div=document.createElement('div');div.className='pool-group';let caption=document.createElement('div');caption.className='pool-label';caption.textContent=(name==='Bracket'?txt('淘汰赛','Knockout'):name+' '+txt('战绩池','record pool'))+' · '+arr.length;div.appendChild(caption);let wrap=document.createElement('div');wrap.className='pool-items';for(let t of arr){let el=document.createElement('div');el.className='team'+(used.has(t.id)?' used':'')+(chosen===t.id?' selected':'');el.draggable=true;el.innerHTML='<span class="name"></span><span class="tag"></span><small></small>';el.querySelector('.name').textContent=t.id;el.querySelector('.tag').textContent=t.region;el.querySelector('small').textContent=Math.round(t.elo);el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',t.id);e.dataTransfer.effectAllowed='move'});el.onclick=()=>{chosen=t.id;render()};wrap.appendChild(el)}div.appendChild(wrap);pool.appendChild(div)}
 let rounds=document.getElementById('rounds');rounds.replaceChildren();let start=cfg.round,end=cfg.format==='swiss'?Math.max(5,start):Math.max(start+3,4);for(let r=1;r<=end;r++){let col=document.createElement('div');col.className='round'+(r===start?' now':'');let head=document.createElement('div');head.className='roundhead';head.textContent=txt('第 ','Round ')+(r)+(r===start?txt(' · 当前抽签',' · Current'):'');col.appendChild(head);
 if(r===start){let indexes={};for(let i=0;i<slots.length;i++){let g=slotGroups[i];(indexes[g]??=[]).push(i)}for(let [group,inds] of Object.entries(indexes)){let g=document.createElement('div');g.className='grouphead';g.textContent=group==='Bracket'?txt('淘汰赛','Knockout'):group;col.appendChild(g);for(let i of inds){let match=document.createElement('div');match.className='match';for(let j=0;j<2;j++){let slot=document.createElement('div');slot.className='slot'+(slots[i][j]?' full':'');let id=slots[i][j];if(id){let t=cfg.teams.find(x=>x.id===id);let n=document.createElement('b');n.textContent=id;slot.appendChild(n);let tag=document.createElement('span');tag.className='tag';tag.textContent=t?.region||'';slot.appendChild(tag)}else{let hint=document.createElement('span');hint.className='placeholder';hint.textContent=txt('拖入队伍 / 点击填入','Drop / click to fill');slot.appendChild(hint)}slot.ondragover=e=>{e.preventDefault();slot.classList.add('hover')};slot.ondragleave=()=>slot.classList.remove('hover');slot.ondrop=e=>{e.preventDefault();slot.classList.remove('hover');put(e.dataTransfer.getData('text/plain'),i,j)};slot.onclick=()=>{if(chosen)put(chosen,i,j);else if(id){slots[i][j]=null;render();emit()}};match.appendChild(slot);if(!j){let vs=document.createElement('div');vs.className='vs';vs.textContent='VS';match.appendChild(vs)}}col.appendChild(match)}}}else{let p=document.createElement('div');p.className='future';p.textContent=txt('等待前几轮赛果后自动生成战绩池与签位','Awaiting earlier results to generate record pools and slots');col.appendChild(p);for(let i=0;i<Math.max(1,Math.floor(cfg.teams.length/Math.pow(2,r-start+1)/2));i++){let x=document.createElement('div');x.className='match disabled';x.innerHTML='<div class="slot">—</div><div class="vs">VS</div><div class="slot">—</div>';col.appendChild(x)}}rounds.appendChild(col)}
 document.getElementById('state').textContent=completed().length+'/'+slots.length+' '+txt('场已锁定','locked matches');send('streamlit:setFrameHeight',{height:document.body.scrollHeight+12})}
function init(a){cfg=a;let groups={};for(let t of cfg.teams)(groups[t.group]??=[]).push(t.id);slotGroups=Object.entries(groups).flatMap(([g,arr])=>Array.from({length:arr.length/2},()=>g));origin=slotGroups.map(()=>[null,null]);slots=origin.map(p=>p.slice());initialized=true;
 document.getElementById('title').textContent=txt('抽签沙盘 · 拖动构建签表','Draw Studio · Build a bracket');document.getElementById('intro').textContent=txt('从上方队伍池拖入下方当前轮的签位。完整对阵自动锁定并评估剩余签表。','Drag teams from the pool into the current-round slots. Completed matches are locked for analysis.');document.getElementById('pooltitle').textContent=txt('队伍池','Team Pool');document.getElementById('poolhint').textContent=txt('可拖动 / 可点击选择','Drag or click to select');document.getElementById('boardtitle').textContent=txt('瑞士轮进程图 / 签表','Swiss Progression / Bracket');document.getElementById('reset').textContent=txt('恢复初始签表','Reset');document.getElementById('clear').textContent=txt('清空签位','Clear');document.getElementById('complete').textContent=txt('导入当前实际签表','Load actual draw');render()}
document.getElementById('reset').onclick=()=>{slots=origin.map(p=>p.slice());chosen=null;render();emit()};document.getElementById('clear').onclick=()=>{slots=slots.map(()=>[null,null]);chosen=null;render();emit()};document.getElementById('complete').onclick=()=>{let real=cfg.startingPairs||[];slots=origin.map(p=>p.slice());let next={};for(let p of real){let g=cfg.teams.find(t=>t.id===p[0])?.group;let i=slotGroups.findIndex((x,j)=>x===g&&!next[j]);if(i>=0&&p.every(id=>cfg.teams.find(t=>t.id===id)?.group===g)&&cfg.allowed[key(...p)]){slots[i]=p.slice();next[i]=true}}chosen=null;render();emit()};

window.addEventListener('message',e=>{if(e.data.type==='streamlit:render'){let cfgNew=e.data.args||{};if(!initialized||JSON.stringify([cfgNew.teams,cfgNew.round,cfgNew.allowed])!==JSON.stringify([cfg.teams,cfg.round,cfg.allowed])||cfgNew.language!==cfg.language)init(cfgNew);send('streamlit:setFrameHeight',{height:document.body.scrollHeight+12})}});send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
