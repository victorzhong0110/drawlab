<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;color:var(--text,#142235);background:transparent}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.hint{font-size:12px;opacity:.75}.actions{display:flex;gap:7px}button{background:#e8eef6;color:#18263a;border:1px solid #cbd5e1;padding:7px 12px;border-radius:8px;cursor:pointer}button:hover{background:#dbeafe}.pool{margin:12px 0}.poolname{font-size:13px;font-weight:700;opacity:.7;margin-bottom:7px}.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:10px}.match{border:1px solid #cbd5e1;border-radius:11px;padding:9px;background:var(--card,#f8fafc);display:flex;align-items:center;gap:7px;min-height:62px}.team{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border-radius:7px;border:1px solid #c8d5e4;background:white;padding:9px;cursor:grab;user-select:none;color:#18263a;font-weight:650}.team:focus{outline:2px solid #2563eb}.team.drag{opacity:.4}.team.over{outline:3px solid #60a5fa}.team .tag{font-size:10px;font-weight:600;background:#e0edf9;border-radius:4px;padding:3px 4px;flex-shrink:0}.team .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vs{color:#64748b;font-weight:700;font-size:11px}.notice{margin:9px 0 0;min-height:20px;font-size:13px}.ok{color:#168355}.bad{color:#c53030}.counter{padding:4px 7px;font-size:11px;background:#ecfdf5;color:#047857;border-radius:6px} @media(prefers-color-scheme:dark){body{--text:#e2e8f0;--card:#182334}.match{border-color:#475569}.poolname{color:#e2e8f0}}
</style></head><body><div class="top"><div><strong id="editor-title">Drag teams to swap opponents</strong><div class="hint" id="editor-hint">Drag one team onto another; only legal complete pairings are accepted. Click two teams to swap without dragging.</div></div><div class="actions"><span class="counter" id="counter"></span><button id="reset" type="button"><span id="reset-label">Reset</span></button><button id="random" type="button"><span id="random-label">Random legal draw</span></button></div></div><div id="root"></div><div id="notice" class="notice"></div>
<script>
let config={},pairs=[],original=[],clicked=null,serial='';
const messages={
 'Drag teams to swap opponents':'拖动队伍以交换对手',
 'Drag one team onto another; only legal complete pairings are accepted. Click two teams to swap without dragging.':'拖动队伍到另一队伍上交换签位；仅允许合法完整签表。也可连续点击两队交换。',
 'Reset':'重置','Random legal draw':'随机合法抽签','All teams':'所有队伍',
 'Blocked: that swap violates a matching restriction. Try another team.':'交换失败：违反配对限制，请选择另一支队伍。',
 'Legal pairing updated. Live preview will refresh if enabled; use full analysis for precision.':'签表已更新，实时分析将自动刷新；完整分析可提高精度。',
 'Reset to original pairing.':'已恢复初始签表。','No legal pairing for a pool.':'此战绩池不存在合法完整配对。',
 'Generated one legal draw.':'已生成一套合法签表。'
};
function tr(s){if(config.language!=='中文')return s; if(s.startsWith('Selected '))return '已选择 '+s.slice(9).replace('. Click another team to swap.','，请点击另一支队伍进行交换。');return messages[s]||s.replace(/^Record (\d+-\d+)$/, '战绩 $1').replace(/^(\d+) matches$/, '$1 场对阵').replace(/^Swap (.+)$/, '交换 $1')}
function localize(){document.getElementById('editor-title').textContent=tr('Drag teams to swap opponents');document.getElementById('editor-hint').textContent=tr('Drag one team onto another; only legal complete pairings are accepted. Click two teams to swap without dragging.');document.getElementById('reset-label').textContent=tr('Reset');document.getElementById('random-label').textContent=tr('Random legal draw')}

const parentSend=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
function keypair(a,b){return [a,b].sort().join('||')}
function isLegal(arr){let present=new Set(),slots=new Map();for(const p of arr){if(p[0]===p[1]||!config.allowed[keypair(...p)])return false;for(const x of p){if(present.has(x))return false;present.add(x)}}return present.size===config.teams.length}
function setStatus(t,good=true){let el=document.getElementById('notice');el.textContent=tr(t);el.className='notice '+(good?'ok':'bad')}
function swap(a,b){if(a===b)return;const out=pairs.map(p=>p.slice());let x=-1,y=-1,xi=-1,yi=-1;out.forEach((p,i)=>p.forEach((t,j)=>{if(t===a){x=i;xi=j}if(t===b){y=i;yi=j}}));if(x<0||y<0)return;out[x][xi]=b;out[y][yi]=a;if(!isLegal(out)){setStatus('Blocked: that swap violates a matching restriction. Try another team.',false);return}pairs=out;clicked=null;render();parentSend('streamlit:setComponentValue',{value:{pairs,change_id:Date.now()}});setStatus('Legal pairing updated. Live preview will refresh if enabled; use full analysis for precision.')}
function render(){let root=document.getElementById('root');root.innerHTML='';let pools=new Map();for(let i=0;i<pairs.length;i++){let g=config.groups[pairs[i][0]]||'All teams';if(!pools.has(g))pools.set(g,[]);pools.get(g).push({p:pairs[i],i})}for(let [name,matches] of pools){let p=document.createElement('section');p.className='pool';let h=document.createElement('div');h.className='poolname';h.textContent=tr(name);p.appendChild(h);let grid=document.createElement('div');grid.className='slots';for(let m of matches){let box=document.createElement('div');box.className='match';for(let j=0;j<2;j++){if(j){let vs=document.createElement('span');vs.textContent='VS';vs.className='vs';box.appendChild(vs)}let id=m.p[j],info=config.info[id],el=document.createElement('div');el.className='team';el.draggable=true;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',tr('Swap '+id));el.innerHTML='<span class="name"></span><span class="tag"></span>';el.querySelector('.name').textContent=id;el.querySelector('.tag').textContent=info.region;el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';el.classList.add('drag')});el.addEventListener('dragend',()=>el.classList.remove('drag'));el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');swap(e.dataTransfer.getData('text/plain'),id)});el.addEventListener('click',()=>{if(clicked===null){clicked=id;setStatus('Selected '+id+'. Click another team to swap.')}else swap(clicked,id)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}});box.appendChild(el)}grid.appendChild(box)}p.appendChild(grid);root.appendChild(p)}document.getElementById('counter').textContent=tr(pairs.length+' matches');parentSend('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
document.getElementById('reset').onclick=()=>{pairs=original.map(p=>p.slice());render();parentSend('streamlit:setComponentValue',{value:{pairs,change_id:Date.now()}});setStatus('Reset to original pairing.')};
document.getElementById('random').onclick=()=>{let ids=config.teams.slice(),groups={};for(let id of ids)(groups[config.groups[id]]??=[]).push(id);let solutions=[];function solve(rest,acc){if(!rest.length){solutions.push(acc.slice());return true}let a=rest[0],bs=rest.slice(1).filter(x=>config.allowed[keypair(a,x)]);for(let b of bs){if(solve(rest.filter(x=>x!==a&&x!==b),[...acc,[a,b]]))return true}return false}let out=[];for(const group of Object.values(groups)){let shuffled=group.sort(()=>Math.random()-.5);solutions=[];if(!solve(shuffled,[])){setStatus('No legal pairing for a pool.',false);return}out.push(...solutions[0])}if(isLegal(out)){pairs=out;render();parentSend('streamlit:setComponentValue',{value:{pairs,change_id:Date.now()}});setStatus('Generated one legal draw.')}};
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;let cfg=e.data.args||{};if(cfg.fingerprint!==serial || cfg.language!==config.language){serial=cfg.fingerprint;config=cfg;localize();original=cfg.pairs.map(p=>p.slice());pairs=original.map(p=>p.slice());clicked=null;render()}parentSend('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})});parentSend('streamlit:componentReady',{apiVersion:1});
</script></body></html>
